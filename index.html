<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مترجم فورى - إيزيدي</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; text-align: center; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    textarea { width: 100%; height: 100px; font-size: 18px; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    .result-box { background: #eef2f5; padding: 15px; border-radius: 5px; text-align: right; font-size: 22px; min-height: 50px; border: 1px solid #ddd; }
    label { font-weight: bold; display: block; margin-bottom: 5px; text-align: right; }
  </style>
</head>
<body>

<div class="container">
  <h2>مترجم إيزيدي مباشر</h2>
  
  <label for="inputText">أدخل النص (عربي أو كرمانجي لاتيني):</label>
  <textarea id="inputText" placeholder="اكتب هنا... مثلاً: merhaba أو مرحبا" oninput="translateLive()"></textarea>

  <label>النتيجة بحروف إيزيدية:</label>
  <div id="outputText" class="result-box">𐺀</div>
</div>

<script>
// 1. قاموس الكلمات الشائعة (عربي -> كرمانجي لاتيني)
const wordDictionary = {
  "مرحبا": "merhaba",
  "اهلا": "bihêr hatî",
  "شكرا": "spas",
  "نعم": "belê",
  "لا": "na"
};

// 2. خريطة تحويل الحروف اللاتينية (الكرمانجية) إلى الحروف الإيزيدية
const ezidiCharMap = {
  'a': '𐺀', 'b': '𐺁', 'c': '𐺂', 'ç': '𐺃', 'd': '𐺆',
  'e': '𐺇', 'ê': '𐺈', 'f': '𐺉', 'g': '𐺊', 'h': '𐺋',
  'i': '𐺌', 'î': '𐺍', 'j': '𐺎', 'k': '𐺏', 'l': '𐺑',
  'm': '𐺓', 'n': '𐺔', 'o': '𐺗', 'p': '𐺘', 'q': '𐺚',
  'r': '𐺛', 's': '𐺝', 'ş': '𐺞', 't': '𐺟', 'u': '𐺠',
  'û': '𐺡', 'v': '𐺢', 'w': '𐺣', 'x': '𐺥', 'y': '𐺦', 'z': '𐺧'
};

function translateLive() {
  let input = document.getElementById("inputText").value.toLowerCase().trim();
  
  if (!input) {
    document.getElementById("outputText").innerText = "";
    return;
  }

  // إذا كانت الكلمة بالعربية، تحويلها أولاً للفظ الكرمانجي
  let textToConvert = wordDictionary[input] || input;

  // تحويل كل حرف كرمانجي إلى ما يقابله بالإيزيدية
  let result = "";
  for (let char of textToConvert) {
    result += ezidiCharMap[char] || char; // إذا لم يجد الحرف يتركه كما هو
  }

  document.getElementById("outputText").innerText = result;
}
</script>

</body>
</html>
