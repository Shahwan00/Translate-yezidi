<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مترجم الحروف إلى الإيزيدية</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 5px; color: #1a1a1a; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    
    .translator-box {
      display: flex;
      flex-direction: row;
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }
    
    .panel {
      flex: 1;
      background: #ffffff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    
    label { font-weight: bold; margin-bottom: 10px; color: #444; }
    
    textarea {
      width: 100%;
      height: 220px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      font-size: 18px;
      resize: vertical;
      outline: none;
    }
    
    textarea:focus { border-color: #4a90e2; }
    
    .ezidi-output {
      background-color: #fafafa;
      font-size: 22px;
      line-height: 1.6;
    }

    /* نافذة الخيارات العائمة */
    .char-picker {
      position: absolute;
      top: 50px;
      right: 25px;
      background: #ffffff;
      border: 2px solid #4a90e2;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: none;
      z-index: 100;
    }

    .char-picker p {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .picker-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .picker-btn {
      background: #e7f5ff;
      border: 1px solid #74c0fc;
      color: #1864ab;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .picker-btn:hover { background: #d0ebff; }

    @media (max-width: 768px) {
      .translator-box { flex-direction: column; }
      .char-picker { right: 15px; left: 15px; }
    }
  </style>
</head>
<body>

  <h1>تحويل الحروف إلى الإيزيدية</h1>
  <p class="subtitle">اكتب بالعربية أو الكرمانجية في أي مكان وتظهر قائمة الاختيارات فوراً</p>

  <div class="translator-box">
    <!-- نافذة اختيارات الحروف المتاحة -->
    <div id="char-picker" class="char-picker">
      <p id="picker-title">اختر الحرف الإيزيدي المطلوب:</p>
      <div id="picker-options" class="picker-options"></div>
    </div>

    <!-- حقل الإدخال -->
    <div class="panel">
      <label for="input-text">النص الأصلي (عربي / لاتيني):</label>
      <textarea id="input-text" placeholder="اكتب أي حرف في البداية أو الوسط أو النهاية..." oninput="handleInput(event)"></textarea>
    </div>

    <!-- حقل النتيجة -->
    <div class="panel">
      <label for="output-text">النص الإيزيدي (Ezidi):</label>
      <textarea id="output-text" class="ezidi-output" readonly placeholder="النتيجة تظهر هنا..."></textarea>
    </div>
  </div>

  <script>
    // 1. خريطة التحويل الافتراضية للحروف
    const defaultMap = {
      'a': '𐺀', 'b': '𐺁', 'c': '𐺂', 'ç': '𐺃', 'd': '𐺆',
      'e': '𐺇', 'ê': '𐺈', 'f': '𐺉', 'g': '𐺊', 'h': '𐺋',
      'i': '𐺌', 'î': '𐺍', 'j': '𐺎', 'k': '𐺏', 'l': '𐺑',
      'm': '𐺓', 'n': '𐺔', 'o': '𐺗', 'p': '𐺘', 'q': '𐺚',
      'r': '𐺛', 's': '𐺝', 'ş': '𐺞', 't': '𐺟', 'u': '𐺠',
      'û': '𐺡', 'v': '𐺢', 'w': '𐺣', 'x': '𐺥', 'y': '𐺦', 'z': '𐺧',

      'ا': '𐺀', 'أ': '𐺀', 'إ': '𐺀', 'آ': '𐺀', 'ء': '𐺀',
      'ب': '𐺁', 'پ': '𐺘', 'ت': '𐺟', 'ث': '𐺟', 'ج': '𐺂',
      'چ': '𐺃', 'ح': '𐺋', 'خ': '𐺥', 'د': '𐺆', 'ذ': '𐺧',
      'ر': '𐺛', 'ز': '𐺧', 'ژ': '𐺎', 'س': '𐺝', 'ش': '𐺞',
      'ص': '𐺝', 'ض': '𐺧', 'ط': '𐺟', 'ظ': '𐺧', 'ع': '𐺀',
      'غ': '𐺊', 'ف': '𐺉', 'ڤ': '𐺢', 'ق': '𐺚', 'ك': '𐺏',
      'گ': '𐺟', 'ڱ': '𐺞', 'ل': '𐺑', 'م': '𐺓', 'ن': '𐺔',
      'ه': '𐺋', 'و': '𐺣', 'ي': '𐺦', 'ى': '𐺦'
    };

    // 2. قوائم الخيارات متعددة الأوجه للحروف المشتركة
    const multiCharOptions = {
      'ك': [
        { label: 'ك (𐺏)', val: '𐺏' },
        { label: 'گ (𐺟)', val: '𐺟' },
        { label: 'ڱ (𐺞)', val: '𐺞' }
      ],
      'ج': [
        { label: 'ج (𐺂)', val: '𐺂' },
        { label: 'چ (𐺃)', val: '𐺃' },
        { label: 'ژ (𐺎)', val: '𐺎' }
      ],
      'چ': [
        { label: 'چ (𐺃)', val: '𐺃' },
        { label: 'ج (𐺂)', val: '𐺂' }
      ],
      'ح': [
        { label: 'ح/هـ (𐺋)', val: '𐺋' },
        { label: 'خ (𐺥)', val: '𐺥' }
      ],
      'س': [
        { label: 'س (𐺝)', val: '𐺝' },
        { label: 'ش (𐺞)', val: '𐺞' }
      ]
    };

    let targetCharIndex = -1; // تحديد موقع الحرف المكتوب بدقة

    function handleInput(e) {
      const inputEl = document.getElementById('input-text');
      const text = inputEl.value;
      const typedChar = e.data; // الحرف المكتوب مؤخراً في أي مكان

      // تحويل النص كاملاً أولاً
      updateOutput();

      // فحص إذا كان الحرف المدخل حديثاً يمتلك خيارات متعددة
      if (typedChar && multiCharOptions[typedChar]) {
        targetCharIndex = inputEl.selectionStart - 1; // حفظ موقع الحرف بدقة
        showPicker(typedChar, multiCharOptions[typedChar]);
      } else {
        hidePicker();
      }
    }

    function updateOutput() {
      const text = document.getElementById('input-text').value;
      let output = '';
      for (let char of text) {
        const lower = char.toLowerCase();
        output += defaultMap[lower] !== undefined ? defaultMap[lower] : char;
      }
      document.getElementById('output-text').value = output;
    }

    function showPicker(char, options) {
      const picker = document.getElementById('char-picker');
      const title = document.getElementById('picker-title');
      const container = document.getElementById('picker-options');

      title.innerText = `اختر الرمز الإيزيدي المناسب لـ (${char}):`;
      container.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'picker-btn';
        btn.innerText = opt.label;
        btn.onclick = () => replaceSelectedChar(opt.val);
        container.appendChild(btn);
      });

      picker.style.display = 'block';
    }

    function hidePicker() {
      document.getElementById('char-picker').style.display = 'none';
    }

    function replaceSelectedChar(ezidiChar) {
      const outputEl = document.getElementById('output-text');
      let currentOutput = outputEl.value.split('');

      // استبدال الحرف الإيزيدي في نفس الموقع بالضبط الذي كُتب فيه الحرف الأصلي
      if (targetCharIndex >= 0 && targetCharIndex < currentOutput.length) {
        currentOutput[targetCharIndex] = ezidiChar;
        outputEl.value = currentOutput.join('');
      }

      hidePicker();
      document.getElementById('input-text').focus();
    }
  </script>

</body>
</html>
