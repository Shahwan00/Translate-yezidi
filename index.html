<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مترجم الحروف العربية واللاتينية إلى الإيزيدية</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 5px; color: #1a1a1a; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    
    .translator-box {
      display: flex;
      flex-direction: row;
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .panel {
      flex: 1;
      background: #ffffff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    
    label { font-weight: bold; margin-bottom: 10px; color: #444; }
    
    textarea {
      width: 100%;
      height: 220px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      font-size: 18px;
      resize: vertical;
      outline: none;
    }
    
    textarea:focus { border-color: #4a90e2; }
    
    .ezidi-output {
      background-color: #fafafa;
      font-size: 22px;
      line-height: 1.6;
    }

    /* مربع التنبيه والاقتراح "هل تقصد" */
    .suggestion-box {
      max-width: 1000px;
      margin: 15px auto 0 auto;
      background: #e7f5ff;
      border: 1px solid #74c0fc;
      border-radius: 8px;
      padding: 10px 15px;
      display: none; /* مخفي افتراضياً */
      text-align: right;
      color: #1864ab;
    }

    .suggestion-btn {
      background: #1c7ed6;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
    }

    .suggestion-btn:hover { background: #1971c2; }

    @media (max-width: 768px) {
      .translator-box { flex-direction: column; }
    }
  </style>
</head>
<body>

  <h1>تحويل الحروف إلى الإيزيدية</h1>
  <p class="subtitle">اكتب بالعربية أو الكرمانجية (اللاتينية) للتحويل المباشر</p>

  <div class="translator-box">
    <!-- حقل الإدخال -->
    <div class="panel">
      <label for="input-text">النص الأصلي (عربي / لاتيني):</label>
      <textarea id="input-text" placeholder="اكتب هنا... مثلاً: ڱالو أو merhaba" oninput="convertText()"></textarea>
    </div>

    <!-- حقل النتيجة -->
    <div class="panel">
      <label for="output-text">النص الإيزيدي (Ezidi):</label>
      <textarea id="output-text" class="ezidi-output" readonly placeholder="النتيجة تظهر هنا..."></textarea>
    </div>
  </div>

  <!-- صندوق "هل تقصد" عند اكتشاف حرف خاص كـ (ڱ) -->
  <div id="suggestion-box" class="suggestion-box">
    <span id="suggestion-text"></span>
    <button class="suggestion-btn" onclick="applySuggestion()">تطبيق التصحيح</button>
  </div>

  <script>
    // خريطة تحويل الحروف المباشرة شاملة الحروف الكردية والعربية
    const map = {
      // الحروف الكرمانجية اللاتينية (Kurdish Latin)
      'a': '𐺀', 'b': '𐺁', 'c': '𐺂', 'ç': '𐺃', 'd': '𐺆',
      'e': '𐺇', 'ê': '𐺈', 'f': '𐺉', 'g': '𐺊', 'h': '𐺋',
      'i': '𐺌', 'î': '𐺍', 'j': '𐺎', 'k': '𐺏', 'l': '𐺑',
      'm': '𐺓', 'n': '𐺔', 'o': '𐺗', 'p': '𐺘', 'q': '𐺚',
      'r': '𐺛', 's': '𐺝', 'ş': '𐺞', 't': '𐺟', 'u': '𐺠',
      'û': '𐺡', 'v': '𐺢', 'w': '𐺣', 'x': '𐺥', 'y': '𐺦', 'z': '𐺧',

      // الحروف العربية والكردية المقابلة (Arabic & Kurdish Alphabet)
      'ا': '𐺀', 'أ': '𐺀', 'إ': '𐺀', 'آ': '𐺀', 'ء': '𐺀',
      'ب': '𐺁', 'پ': '𐺘', 'ت': '𐺟', 'ث': '𐺟', 'ج': '𐺂',
      'چ': '𐺃', 'ح': '𐺋', 'خ': '𐺥', 'د': '𐺆', 'ذ': '𐺧',
      'ر': '𐺛', 'ڕ': '𐺛', 'ز': '𐺧', 'ژ': '𐺎', 'س': '𐺝',
      'ش': '𐺞', 'ص': '𐺝', 'ض': '𐺧', 'ط': '𐺟', 'ظ': '𐺧',
      'ع': '𐺀', 'غ': '𐺊', 'ف': '𐺉', 'ڤ': '𐺢', 'ق': '𐺚',
      'ك': '𐺏', 'ک': '𐺏', 'گ': '𐺟', 'ڱ': '𐺟', // تحويل ڱ إلى حرف Gaf الإيزيدي
      'ل': '𐺑', 'ڵ': '𐺑', 'م': '𐺓', 'ن': '𐺔', 'ه': '𐺋',
      'و': '𐺣', 'ۆ': '𐺗', 'ي': '𐺦', 'ى': '𐺦', 'ێ': '𐺈'
    };

    let suggestedWord = "";

    function convertText() {
      const input = document.getElementById('input-text').value;
      let output = '';

      for (let char of input) {
        const lowerChar = char.toLowerCase();
        output += map[lowerChar] !== undefined ? map[lowerChar] : char;
      }

      document.getElementById('output-text').value = output;

      // فحص وجود أحرف خاصة مثل "ڱ" واقتراح التصحيح
      checkSuggestions(input);
    }

    function checkSuggestions(text) {
      const suggestionBox = document.getElementById('suggestion-box');
      const suggestionText = document.getElementById('suggestion-text');

      // إذا احتوت الكلمة على الحرف "ڱ"
      if (text.includes('ڱ')) {
        suggestedWord = text.replace(/ڱ/g, 'گ'); // استبدال ڱ بـ گ (أو الحرف العربي المقابل)
        suggestionText.innerHTML = `💡 هل تقصد كتابة: <strong>"${suggestedWord}"</strong> بدلاً من <strong>"${text}"</strong>؟`;
        suggestionBox.style.display = 'block';
      } else {
        suggestionBox.style.display = 'none';
      }
    }

    function applySuggestion() {
      document.getElementById('input-text').value = suggestedWord;
      convertText(); // إعادة التحويل بالنص المحدث
    }
  </script>

</body>
</html>
